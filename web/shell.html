<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#102334">
  <title>Astro · Um Pequeno Recomeço</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#102334; color:#f0e9d9; font:18px system-ui,sans-serif; overscroll-behavior:none }
    #game { position:fixed; top:0; left:0; width:100vw; height:100dvh; box-sizing:border-box; padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px) }
    canvas { display:block; width:100% !important; height:100% !important; touch-action:none; outline:none }
    #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:20px; padding:28px; background:#102334; text-align:center }
    progress { width:min(360px,80vw); accent-color:#b7d8bf }
    #error { max-width:600px; line-height:1.6 }
  </style>
  $GODOT_HEAD_INCLUDE
</head>
<body>
  <main id="game"><canvas id="canvas" tabindex="0" aria-label="Astro, jogo de sobrevivência em Marte">Seu navegador precisa suportar canvas para jogar.</canvas></main>
  <div id="status"><strong>✦ ASTRO / UM PEQUENO RECOMEÇO</strong><span id="message">Preparando Marte…</span><progress id="progress"></progress><div id="error" hidden></div></div>
  <script src="$GODOT_URL"></script>
  <script>
    const config = $GODOT_CONFIG;
    if (new URLSearchParams(location.search).has('qa')) config.args.push('--', '--web-test');
    // Resize to the safe-area container rather than drawing under a phone notch.
    config.canvasResizePolicy = 0;
    const canvas = document.getElementById('canvas');
    const area = document.getElementById('game');
    function resize() {
      const viewport = window.visualViewport;
      area.style.width = (viewport ? viewport.width : window.innerWidth) + 'px';
      area.style.height = (viewport ? viewport.height : window.innerHeight) + 'px';
      area.style.left = (viewport ? viewport.offsetLeft : 0) + 'px';
      area.style.top = (viewport ? viewport.offsetTop : 0) + 'px';
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * ratio));
      const height = Math.max(1, Math.round(rect.height * ratio));
      if (canvas.width !== width) canvas.width = width;
      if (canvas.height !== height) canvas.height = height;
    }
    let resizeFrame = 0;
    function scheduleResize() {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(resize);
    }
    new ResizeObserver(scheduleResize).observe(area);
    window.addEventListener('resize', scheduleResize);
    window.addEventListener('orientationchange', scheduleResize);
    document.addEventListener('fullscreenchange', scheduleResize);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', scheduleResize);
      window.visualViewport.addEventListener('scroll', scheduleResize);
    }
    resize();
    canvas.addEventListener('contextmenu', event => event.preventDefault());
    canvas.addEventListener('touchmove', event => event.preventDefault(), {passive:false});
    const engine = new Engine(config);
    engine.startGame({
      canvas,
      onProgress(current,total) {
        const bar = document.getElementById('progress');
        if (total > 0) { bar.max = total; bar.value = current; }
      }
    }).then(() => {
      scheduleResize();
      document.getElementById('status').style.display = 'none';
      canvas.focus();
    }).catch(error => {
      document.getElementById('message').textContent = 'Não foi possível iniciar o jogo.';
      document.getElementById('progress').hidden = true;
      const message = document.getElementById('error');
      message.hidden = false;
      message.textContent = 'Use um navegador atualizado com WebGL 2 habilitado. Detalhes: ' + String(error);
    });
  </script>
</body>
</html>
